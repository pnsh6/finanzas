      #reader { width: 100%; max-width: 400px; margin: 0 auto; }
      button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; margin-top: 10px; }
      button:disabled { background: #9bbfe0; }
      select, input[type="text"] { width: 100%; padding: 10px; font-size: 16px; margin-top: 5px; box-sizing: border-box; }
      select:disabled { background: #eee; color: #777; }
      .hidden { display: none; }
      .info { font-size: 14px; margin-bottom: 8px; }
      .campo { margin-bottom: 12px; }
      .nota { font-size: 12px; color: #888; margin-top: 4px; }
      .error-box { background: #fdecea; color: #b3261e; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }

    <h2>Escáner de Juguetes</h2>
    <div id="error-box" class="error-box hidden"></div>
    <div class="card" id="reader-card"><div id="reader"></div></div>

    <div id="form-container" class="card hidden">
      <h3>Detalle del Juguete</h3>
      <p class="info"><strong>ID Juguete:</strong> <span id="txt-codigo"></span></p>
      <p class="info"><strong>Nombre del Material:</strong> <span id="txt-nombre"></span></p>
      <p class="info"><strong>Tipo de Material:</strong> <span id="txt-tipo"></span></p>
      <p class="info"><strong>Última limpieza:</strong> <span id="txt-fecha-limpieza">-</span></p>
      <p class="info"><strong>Último responsable:</strong> <span id="txt-responsable-actual">-</span></p>

      <div class="campo">
        <label for="select-ubicacion"><strong>Sala/Ubicación Actual:</strong></label>

          <option value="Sala 304">Sala 304</option>
          <option value="Sala 305">Sala 305</option>
          <option value="Sala 306">Sala 306</option>
          <option value="Sala 307">Sala 307</option>
          <option value="Sala 308">Sala 308</option>
          <option value="Sala 309">Sala 309</option>
          <option value="Sala 310">Sala 310</option>
        </select>
        <div class="nota" id="nota-ubicacion"></div>
      </div>

      <div class="campo">
        <label for="select-estado"><strong>Estado:</strong></label>
        <select id="select-estado">
          <option value="Disponible">Disponible</option>
          <option value="En Uso">En Uso</option>
          <option value="Pendiente de Limpieza">Pendiente de Limpieza</option>
          <option value="Dañado">Dañado</option>
        </select>
      </div>

      <div class="campo">
        <label for="input-responsable"><strong>Responsable:</strong></label>
        <input type="text" id="input-responsable" placeholder="Nombre de quien actualiza">
      </div>

      <p class="nota">La fecha y hora de limpieza se registra automáticamente al guardar.</p>

      <button id="btn-guardar" onclick="guardarCambios()">Actualizar</button>
      <button style="background: #6c757d;" onclick="reiniciarEscaner()">Escanear Otro</button>
    </div>
